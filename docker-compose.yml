services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantpilot}
      POSTGRES_DB: ${POSTGRES_DB:-quantpilot}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantpilot}:${POSTGRES_PASSWORD:-quantpilot}@db:5432/${POSTGRES_DB:-quantpilot}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      INGESTION_ATTEMPTS: ${INGESTION_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
