[project]
name = "quantpilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<4", "numpy>=2.2,<3", "yfinance>=0.2.54,<2", "exchange-calendars>=4.8,<5"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<4"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
files = ["apps/api", "packages", "pipelines"]
